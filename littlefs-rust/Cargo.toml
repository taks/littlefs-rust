[package]
name = "littlefs-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Safe Rust API for the LittleFS embedded filesystem"
license = "BSD-3-Clause"
repository = "https://github.com/light-player/littlefs-rust"
readme = "README.md"
keywords = ["littlefs", "filesystem", "embedded", "no-std", "flash"]
categories = ["embedded", "filesystem", "no-std"]

[lib]
name = "littlefs_rust"
path = "src/lib.rs"

[dependencies]
littlefs-rust-core = { version = "0.1", path = "../littlefs-rust-core" }
bitflags = "2"

[dev-dependencies]
divan = { version = "5.0.1", package = "codspeed-divan-compat" }
env_logger = "0.10"

[[bench]]
name = "filesystem"
harness = false

[features]
default = ["std"]
alloc = ["littlefs-rust-core/alloc"]
std = ["littlefs-rust-core/std", "alloc"]
log = ["littlefs-rust-core/log"]
defmt = ["littlefs-rust-core/defmt"]
